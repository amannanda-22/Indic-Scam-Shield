name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Engine + TS/Python parity fixtures + hybrid benchmark
        run: npm test
      - name: Blind-40 set
        run: npm run test:blind
      - name: MCP server end-to-end (stdio)
        run: npm run test:mcp
      - name: Production build
        run: npm run build
